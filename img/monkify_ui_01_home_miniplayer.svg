    <rect x="339" y="23" width="3" height="12" rx="1" fill="#000000"/>
    <rect x="345" y="23" width="3" height="12" rx="1" fill="#000000"/>

    <!-- Progress Line at bottom of miniplayer -->
    <rect x="8" y="55" width="350" height="2" rx="1" fill="#3E3E3E"/>
    <rect x="8" y="55" width="140" height="2" rx="1" fill="#1DB954"/>
  </g>

  <!-- BOTTOM NAVIGATION BAR -->
  <g transform="translate(0, 762)">
    <rect width="390" height="82" fill="#121212" fill-opacity="0.95"/>
    <line x1="0" y1="0" x2="390" y2="0" stroke="#242424" stroke-width="1"/>

    <!-- Tab 1: Inicio (Active) -->
    <g transform="translate(65, 12)">
      <path d="M12 4 L2 12 H5 V20 H10 V15 H14 V20 H19 V12 H22 Z" fill="#FFFFFF"/>
      <text x="12" y="32" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Inicio</text>
