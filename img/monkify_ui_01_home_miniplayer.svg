    <text x="60" y="42" fill="#1DB954" font-family="system-ui, sans-serif" font-size="11" font-weight="500">M83 • Monkify Connect (PC)</text>
    
    <!-- Controls (Right) -->
    <!-- Devices Icon -->
    <path d="M280 29 H294 M283 23 H291 C292 23 293 24 293 25 V31 H281 V25 C281 24 282 23 283 23 Z" stroke="#1DB954" stroke-width="1.5" fill="none"/>
    <!-- Heart Icon -->
