  <!-- Card 2 -->
  <g transform="translate(180, 334)">
    <linearGradient id="album2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <rect width="140" height="140" rx="8" fill="url(#album2)"/>
