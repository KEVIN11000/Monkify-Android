  </radialGradient>
  <rect width="390" height="300" rx="40" fill="url(#topGlow)"/>

  <!-- Status Bar -->
  <text x="32" y="38" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="600">09:41</text>
  <circle cx="330" cy="34" r="3" fill="#FFFFFF"/>
  <rect x="340" y="28" width="20" height="11" rx="3" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="342" y="30" width="13" height="7" rx="1.5" fill="#FFFFFF"/>
  <path d="M361 32 V36" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

  <!-- Header Section -->
  <text x="24" y="90" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="24" font-weight="700">Buenas noches</text>
  <!-- Bell / History / Settings -->
  <circle cx="316" cy="82" r="16" fill="#1F1F1F"/>
  <path d="M316 76 C313 76 311 78 311 81 V85 L309 87 H323 L321 85 V81 C321 78 319 76 316 76 Z" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
  <circle cx="354" cy="82" r="16" fill="#1F1F1F"/>
