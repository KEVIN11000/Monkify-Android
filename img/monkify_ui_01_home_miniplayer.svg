    <rect width="140" height="140" rx="8" fill="url(#album1)"/>
    <circle cx="70" cy="70" r="30" fill="#000000" fill-opacity="0.3"/>
    <path d="M64 58 L82 70 L64 82 Z" fill="#FFFFFF"/>
    <text x="0" y="162" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Random Access</text>
    <text x="0" y="179" fill="#A7A7A7" font-family="system-ui, sans-serif" font-size="11">Álbum • Daft Punk</text>
