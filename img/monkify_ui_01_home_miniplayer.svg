    <rect width="54" height="54" rx="6" fill="#EF4444"/>
    <text x="27" y="33" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">🎸</text>
    <text x="64" y="32" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Rock Classics</text>
  </g>

