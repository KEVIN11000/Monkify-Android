    <text x="16" y="36" fill="#1DB954" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Daily Mix 2</text>
    <text x="16" y="54" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Arctic Monkeys, Strokes</text>
  </g>

