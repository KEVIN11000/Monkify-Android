  <rect x="90" y="112" width="68" height="30" rx="15" fill="#242424"/>
  <text x="124" y="131" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Música</text>

  <rect x="166" y="112" width="88" height="30" rx="15" fill="#242424"/>
  <text x="210" y="131" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Podcasts</text>

  <!-- Quick Grid (6 items) -->
  <!-- Item 1: Liked Songs -->
  <g transform="translate(24, 158)">
