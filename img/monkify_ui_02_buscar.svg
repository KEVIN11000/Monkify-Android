<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" fill="none">
  <!-- Background -->
  <rect width="390" height="844" rx="40" fill="#121212"/>

  <!-- Status Bar -->
  <text x="32" y="38" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="600">09:41</text>
  <circle cx="330" cy="34" r="3" fill="#FFFFFF"/>
  <rect x="340" y="28" width="20" height="11" rx="3" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="342" y="30" width="13" height="7" rx="1.5" fill="#FFFFFF"/>
  <path d="M361 32 V36" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

  <!-- Header -->
  <text x="24" y="90" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="24" font-weight="700">Buscar</text>
  
  <!-- Camera / Scan Icon -->
  <circle cx="350" cy="82" r="16" fill="#1F1F1F"/>
  <path d="M343 86 V82 C343 80.5 344.5 79 346 79 H354 C355.5 79 357 80.5 357 82 V86 C357 87.5 355.5 89 354 89 H346 C344.5 89 343 87.5 343 86 Z M350 86 C351.5 86 352.5 85 352.5 84 C352.5 83 351.5 82 350 82 C348.5 82 347.5 83 347.5 84 C347.5 85 348.5 86 350 86 Z" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>

  <!-- Search Input Bar -->
  <g transform="translate(24, 110)">
    <rect width="342" height="46" rx="8" fill="#FFFFFF"/>
    <!-- Magnifying Glass -->
    <circle cx="22" cy="22" r="6" stroke="#121212" stroke-width="2" fill="none"/>
    <line x1="26.5" y1="26.5" x2="31" y2="31" stroke="#121212" stroke-width="2" stroke-linecap="round"/>
    <text x="42" y="27" fill="#535353" font-family="system-ui, sans-serif" font-size="14" font-weight="500">¿Qué te apetece escuchar?</text>
  </g>

  <!-- MONKIFY IMPORT BANNER (Spotify Link Importer) -->
  <g transform="translate(24, 172)">
    <defs>
      <linearGradient id="importGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#1DB954"/>
        <stop offset="100%" stop-color="#047857"/>
      </linearGradient>
    </defs>
    <rect width="342" height="88" rx="12" fill="url(#importGrad)"/>
    <!-- Icon Cloud/Download -->
    <circle cx="36" cy="44" r="20" fill="#000000" fill-opacity="0.25"/>
    <path d="M30 46 L36 52 L42 46 M36 34 V50" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Banner Text -->
    <text x="68" y="36" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Importar desde Spotify</text>
    <text x="68" y="52" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">Pega un enlace de canción o playlist</text>
    <!-- Paste Action Pill -->
    <rect x="68" y="60" width="112" height="20" rx="10" fill="#000000" fill-opacity="0.35"/>
    <text x="124" y="74" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Pegar enlace 📋</text>
  </g>

  <!-- Section Title: Explorar todo -->
  <text x="24" y="290" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Explorar todo</text>

  <!-- Category Grid (6 Tiles) -->
  <!-- Tile 1: Rock -->
  <g transform="translate(24, 308)">
    <rect width="165" height="92" rx="8" fill="#E11D48"/>
    <text x="14" y="32" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Rock</text>
    <circle cx="140" cy="65" r="28" fill="#BE123C" transform="rotate(-15 140 65)"/>
    <text x="135" y="70" font-size="20">🎸</text>
  </g>

  <!-- Tile 2: Synthwave / Electronic -->
  <g transform="translate(201, 308)">
    <rect width="165" height="92" rx="8" fill="#7C3AED"/>
    <text x="14" y="32" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Electrónica</text>
    <circle cx="140" cy="65" r="28" fill="#6D28D9" transform="rotate(15 140 65)"/>
    <text x="135" y="70" font-size="20">⚡</text>
  </g>

  <!-- Tile 3: Hip-Hop -->
  <g transform="translate(24, 412)">
    <rect width="165" height="92" rx="8" fill="#EA580C"/>
    <text x="14" y="32" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Hip-Hop</text>
    <circle cx="140" cy="65" r="28" fill="#C2410C"/>
    <text x="135" y="70" font-size="20">🎧</text>
  </g>

  <!-- Tile 4: Chill / Lo-Fi -->
  <g transform="translate(201, 412)">
    <rect width="165" height="92" rx="8" fill="#0D9488"/>
    <text x="14" y="32" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Chill &amp; Lo-Fi</text>
    <circle cx="140" cy="65" r="28" fill="#0F766E"/>
    <text x="135" y="70" font-size="20">☕</text>
  </g>

  <!-- Tile 5: Metal -->
  <g transform="translate(24, 516)">
    <rect width="165" height="92" rx="8" fill="#334155"/>
    <text x="14" y="32" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Metal</text>
    <circle cx="140" cy="65" r="28" fill="#1E293B"/>
    <text x="135" y="70" font-size="20">🔥</text>
  </g>

  <!-- Tile 6: Indie -->
  <g transform="translate(201, 516)">
    <rect width="165" height="92" rx="8" fill="#4338CA"/>
    <text x="14" y="32" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Indie Pop</text>
    <circle cx="140" cy="65" r="28" fill="#3730A3"/>
    <text x="135" y="70" font-size="20">✨</text>
  </g>

  <!-- Section: Búsquedas recientes -->
  <text x="24" y="635" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Búsquedas recientes</text>
  <g transform="translate(24, 648)">
    <circle cx="12" cy="12" r="12" fill="#242424"/>
    <text x="32" y="16" fill="#A7A7A7" font-family="system-ui, sans-serif" font-size="13">Daft Punk • Artista</text>
  </g>

  <!-- FLOATING MINI-PLAYER (Always Consistent) -->
  <g transform="translate(12, 696)">
    <rect width="366" height="58" rx="10" fill="#282828"/>
    <rect x="8" y="8" width="42" height="42" rx="6" fill="#3B82F6"/>
    <text x="60" y="27" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Midnight City</text>
    <text x="60" y="42" fill="#1DB954" font-family="system-ui, sans-serif" font-size="11" font-weight="500">M83 • Monkify Connect (PC)</text>
    <!-- Devices Icon -->
    <path d="M280 29 H294 M283 23 H291 C292 23 293 24 293 25 V31 H281 V25 C281 24 282 23 283 23 Z" stroke="#1DB954" stroke-width="1.5" fill="none"/>
    <!-- Heart Icon -->
    <path d="M312 31 L307 26 C305 24 305 21 307 19 C309 17 311 19 312 21 C313 19 315 17 317 19 C319 21 319 24 317 26 Z" fill="#1DB954"/>
    <!-- Play/Pause -->
    <circle cx="344" cy="29" r="14" fill="#FFFFFF"/>
    <rect x="339" y="23" width="3" height="12" rx="1" fill="#000000"/>
    <rect x="345" y="23" width="3" height="12" rx="1" fill="#000000"/>
    <!-- Progress Line -->
    <rect x="8" y="55" width="350" height="2" rx="1" fill="#3E3E3E"/>
    <rect x="8" y="55" width="140" height="2" rx="1" fill="#1DB954"/>
  </g>

  <!-- BOTTOM NAVIGATION BAR (Buscar Active) -->
  <g transform="translate(0, 762)">
    <rect width="390" height="82" fill="#121212" fill-opacity="0.95"/>
    <line x1="0" y1="0" x2="390" y2="0" stroke="#242424" stroke-width="1"/>

    <!-- Tab 1: Inicio -->
    <g transform="translate(65, 12)">
      <path d="M12 4 L2 12 H5 V20 H10 V15 H14 V20 H19 V12 H22 Z" fill="#A7A7A7"/>
      <text x="12" y="32" fill="#A7A7A7" font-family="system-ui, sans-serif" font-size="10" font-weight="500" text-anchor="middle">Inicio</text>
    </g>

    <!-- Tab 2: Buscar (Active White) -->
    <g transform="translate(183, 12)">
      <circle cx="10" cy="10" r="6" stroke="#FFFFFF" stroke-width="2.5" fill="none"/>
      <line x1="15" y1="15" x2="20" y2="20" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <text x="12" y="32" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Buscar</text>
    </g>

    <!-- Tab 3: Tu Biblioteca -->
    <g transform="translate(301, 12)">
      <path d="M5 4 V20 M10 4 V20 M15 4 L19 20" stroke="#A7A7A7" stroke-width="2" stroke-linecap="round"/>
      <text x="12" y="32" fill="#A7A7A7" font-family="system-ui, sans-serif" font-size="10" font-weight="500" text-anchor="middle">Biblioteca</text>
    </g>
  </g>

  <!-- Android/iOS Home Indicator -->
  <rect x="125" y="830" width="140" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.4"/>
</svg>
