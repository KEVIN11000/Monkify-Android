name: Release APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-configuration-cache

      - name: Setup Release Keystore
        run: |
          mkdir -p app/keystore
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            printf '%s' "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/keystore/monkify-release.jks
            echo "Permanent release keystore restored from GitHub Actions Secrets."
          elif [ -f app/keystore/monkify-release.jks ]; then
            echo "Using repository release keystore."
          else
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not configured in GitHub repository!"
            echo "Failing release build to prevent generating an ephemeral random key that breaks updates."
            exit 1
          fi
          if [ ! -s app/keystore/monkify-release.jks ]; then
            echo "::error::Keystore file app/keystore/monkify-release.jks is missing or empty!"
            exit 1
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PATH: app/keystore/monkify-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing required signing secrets (KEYSTORE_PASSWORD, KEY_ALIAS, or KEY_PASSWORD)!"
            exit 1
          fi
          ./gradlew assembleRelease --no-configuration-cache

      - name: Verify APK Cryptographic Signature
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No release APK found to verify!"
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose --print-certs "$APK_PATH" | tee apksigner_output.txt
            if ! grep -qi "62ede63ffb1e550f868e76000252f64e33940845385b6d307e342667aa744b5f" apksigner_output.txt; then
              echo "::error::APK signature SHA-256 does not match official Monkify release certificate!"
              exit 1
            fi
          fi

      - name: Prepare Release Artifact
        run: |
          mkdir -p release-artifacts
          # Find generated APK (signed or unsigned) and rename to standard naming
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" release-artifacts/Monkify-${{ github.ref_name }}.apk
            echo "Artifact prepared at release-artifacts/Monkify-${{ github.ref_name }}.apk"
          else
            echo "Error: No APK found in app/build/outputs/apk/release" && exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.apk
          generate_release_notes: true
          name: Monkify ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
